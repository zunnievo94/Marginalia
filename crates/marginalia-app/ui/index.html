<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marginalia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="workbench">
    <nav id="activitybar" aria-label="Views">
      <button class="activity" data-view="chapters" title="Chapters (Ctrl+1)">
        <svg viewBox="0 0 24 24"><path d="M4 6h2v2H4zm4 0h12v2H8zM4 11h2v2H4zm4 0h12v2H8zm-4 5h2v2H4zm4 0h12v2H8z"/></svg>
      </button>
      <button class="activity" data-view="library" title="Library (Ctrl+2)">
        <svg viewBox="0 0 24 24"><path d="M4 4h4v16H4zm5 0h4v16H9zm5.2 1.1 3.9-1 4 15.5-3.9 1z"/></svg>
      </button>
      <button class="activity" data-view="voices" title="Voices (Ctrl+3)">
        <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0-9 9v6a3 3 0 0 0 3 3h2v-8H5v-1a7 7 0 0 1 14 0v1h-3v8h2a3 3 0 0 0 3-3v-6a9 9 0 0 0-9-9z"/></svg>
      </button>
      <div class="spacer"></div>
      <button class="activity" data-view="settings" title="Settings (Ctrl+,)">
        <svg viewBox="0 0 24 24"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1l-.4-2.6h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L4.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
      </button>
    </nav>

    <aside id="sidebar">
      <header id="sidebar-title"></header>
      <div id="sidebar-content"></div>
    </aside>
    <div id="sash" title="Drag to resize"></div>

    <main id="editor">
      <div id="tabs"></div>
      <div id="breadcrumbs">
        <span id="crumbs"></span>
        <span class="grow"></span>
        <button class="icon-btn" id="btn-prev" title="Previous chapter (←)">‹</button>
        <button class="icon-btn" id="btn-next" title="Next chapter (→)">›</button>
        <button class="icon-btn" id="btn-notes" title="Toggle notes panel (Ctrl+Shift+M)">
          <svg viewBox="0 0 24 24"><path d="M4 3h12l4 4v14H4zm2 2v14h12V8h-3V5zm2 5h8v2H8zm0 4h8v2H8z"/></svg>
        </button>
      </div>
      <div id="content" tabindex="0"></div>
    </main>

    <aside id="notes-panel" aria-label="Notes">
      <header class="panel-title">
        <span>Notes</span><span class="badge" id="notes-count">0</span><span class="grow"></span>
        <button class="icon-btn" id="notes-export" title="Export notes as Markdown">⤓</button>
        <button class="icon-btn" id="notes-close" title="Close">×</button>
      </header>
      <div class="filter"><input type="search" id="notes-filter" placeholder="Filter notes"></div>
      <div id="notes-list"></div>
    </aside>
  </div>

  <footer id="statusbar">
    <div class="left">
      <span class="item" id="st-book"></span>
      <span class="item" id="st-chapter"></span>
      <span class="item" id="st-progress"></span>
      <button class="item" id="st-notes" title="Notes (Ctrl+Shift+M)"></button>
    </div>
    <div class="right">
      <span class="item" id="st-voice" title="Voice"></span>
      <button class="item" id="st-speed" title="Speaking speed">1.0×</button>
      <button class="item" id="st-stop" title="Stop">■</button>
      <button class="item" id="st-play" title="Read aloud (Space)">▶ Read aloud</button>
    </div>
  </footer>

  <button id="sel-note" hidden>✎ Note</button>
  <div id="note-editor" hidden>
    <div class="quote"></div>
    <textarea placeholder="Write a note…  (Ctrl+Enter to save, Esc to cancel)"></textarea>
    <div class="row">
      <span class="colors">
        <button data-color="amber" title="Amber"></button><button data-color="green" title="Green"></button><button data-color="blue" title="Blue"></button><button data-color="rose" title="Rose"></button>
      </span>
      <span class="grow"></span>
      <button class="btn small secondary" data-act="delete">Delete</button>
      <button class="btn small secondary" data-act="cancel">Cancel</button>
      <button class="btn small" data-act="save">Save</button>
    </div>
  </div>

  <div id="toasts"></div>
  <script src="app.js"></script>
</body>
</html>
