name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux dependencies (audio, webview)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y libasound2-dev
          libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev
          libjavascriptcoregtk-4.1-dev
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: target/sherpa-onnx-prebuilt
      # sherpa-onnx-sys downloads its libraries into target/sherpa-onnx-prebuilt.
      # A partly restored cache can hold its build-script output, or even the
      # lib directory, without the libraries themselves; then drop both so
      # the build script downloads them again.
      - name: Check the cached sherpa-onnx libraries
        shell: bash
        run: |
          if ! ls target/sherpa-onnx-prebuilt/*/lib/*sherpa-onnx-c-api* >/dev/null 2>&1; then
            rm -rf target/sherpa-onnx-prebuilt \
              target/*/build/sherpa-onnx-sys-* target/*/.fingerprint/sherpa-onnx-sys-* \
              target/*/*/build/sherpa-onnx-sys-* target/*/*/.fingerprint/sherpa-onnx-sys-*
          fi
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - run: cargo build -p marginalia-cli --no-default-features
