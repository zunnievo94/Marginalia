name: Release

# Push a tag like `v0.0.1` (or run this workflow by hand with a tag name) to
# build installers for Windows, macOS and Linux and publish them as a GitHub
# release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, e.g. v0.0.1 (created on the selected branch if missing)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<'NOTES'
          Early test build of Marginalia, an EPUB/MOBI/PRC reader that can read books aloud.

          **Downloads**
          - **Windows**: `Marginalia-windows-x64-setup.exe` (or the `.msi`)
          - **macOS**: `Marginalia-macos-arm64.dmg` (Apple Silicon) or `Marginalia-macos-x64.dmg` (Intel)
          - **Linux**: `Marginalia-linux-x86_64.AppImage` (any distro: `chmod +x` and run) or the `.deb`
          - **Command line**: `marginalia-cli-*` archives

          **These builds are not code-signed yet**
          - Windows SmartScreen: click *More info → Run anyway*.
          - macOS says the app is damaged or from an unidentified developer: after
            copying it to Applications, run `xattr -cr /Applications/Marginalia.app`.

          **License**: GPL-3.0-or-later. The source code of this release is
          this tag; third-party components are listed in THIRD_PARTY_NOTICES.md.

          Read-aloud runs on your computer. The first time, download a voice
          model (30–600 MB) for your book's language in the Voices view. For
          Vietnamese, Piper vais1000 is small and quick to download, and
          VieNeu-TTS v3 Turbo or Nano sound the most natural.
          NOTES
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "Marginalia $TAG" --notes-file notes.md

  app:
    name: App (${{ matrix.name }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          # `assets`: "<built file glob> <stable release name>" pairs. Stable
          # names let the README link to releases/latest/download/<name>.
          - name: Linux
            os: ubuntu-22.04 # oldest supported glibc, so the AppImage runs on more distros
            args: ""
            assets: >-
              target/release/bundle/appimage/*.AppImage Marginalia-linux-x86_64.AppImage
              target/release/bundle/deb/*.deb Marginalia-linux-amd64.deb
          - name: Windows
            os: windows-latest
            args: ""
            assets: >-
              target/release/bundle/nsis/*-setup.exe Marginalia-windows-x64-setup.exe
              target/release/bundle/msi/*.msi Marginalia-windows-x64.msi
          - name: macOS Apple Silicon
            os: macos-latest
            args: --target aarch64-apple-darwin
            assets: >-
              target/aarch64-apple-darwin/release/bundle/dmg/*.dmg Marginalia-macos-arm64.dmg
          - name: macOS Intel
            os: macos-latest
            args: --target x86_64-apple-darwin
            assets: >-
              target/x86_64-apple-darwin/release/bundle/dmg/*.dmg Marginalia-macos-x64.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev
          libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
          libasound2-dev patchelf

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.args }}
          cache-directories: target/sherpa-onnx-prebuilt
      # sherpa-onnx-sys downloads its libraries into target/sherpa-onnx-prebuilt.
      # A partly restored cache can hold its build-script output without
      # them; then rebuild it so the libraries are downloaded again.
      - name: Check the cached sherpa-onnx libraries
        shell: bash
        run: |
          if ! ls target/sherpa-onnx-prebuilt/*/lib/*sherpa-onnx-c-api* >/dev/null 2>&1; then
            rm -rf target/sherpa-onnx-prebuilt \
              target/*/build/sherpa-onnx-sys-* target/*/.fingerprint/sherpa-onnx-sys-* \
              target/*/*/build/sherpa-onnx-sys-* target/*/*/.fingerprint/sherpa-onnx-sys-*
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build installers
        working-directory: crates/marginalia-app
        run: npx --yes @tauri-apps/cli@2 build ${{ matrix.args }}

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSETS: ${{ matrix.assets }}
        run: |
          set -euo pipefail
          read -ra parts <<< "$ASSETS"
          for ((i = 0; i < ${#parts[@]}; i += 2)); do
            files=( ${parts[i]} )  # expand the glob
            if [ ! -f "${files[0]}" ]; then
              echo "::error::no file matches ${parts[i]}"
              exit 1
            fi
            cp "${files[0]}" "${parts[i+1]}"
            gh release upload "$TAG" "${parts[i+1]}" --clobber
          done

  cli:
    name: CLI (${{ matrix.target }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-directories: target/sherpa-onnx-prebuilt
      # sherpa-onnx-sys downloads its libraries into target/sherpa-onnx-prebuilt.
      # A partly restored cache can hold its build-script output without
      # them; then rebuild it so the libraries are downloaded again.
      - name: Check the cached sherpa-onnx libraries
        shell: bash
        run: |
          if ! ls target/sherpa-onnx-prebuilt/*/lib/*sherpa-onnx-c-api* >/dev/null 2>&1; then
            rm -rf target/sherpa-onnx-prebuilt \
              target/*/build/sherpa-onnx-sys-* target/*/.fingerprint/sherpa-onnx-sys-* \
              target/*/*/build/sherpa-onnx-sys-* target/*/*/.fingerprint/sherpa-onnx-sys-*
          fi
      - run: cargo build --release --locked -p marginalia-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=marginalia-cli-${{ matrix.target }}
          mkdir "$name"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md "$name"/
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/marginalia.exe "$name"/
            7z a "$name.zip" "$name" >/dev/null
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            cp target/${{ matrix.target }}/release/marginalia "$name"/
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" "$ASSET" --clobber
