[workspace]
resolver = "2"
members = ["crates/marginalia-core", "crates/marginalia-tts", "crates/marginalia-cli", "crates/marginalia-app"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/zunnievo94/Marginalia"
rust-version = "1.82"

[workspace.dependencies]
marginalia-core = { path = "crates/marginalia-core" }
marginalia-tts = { path = "crates/marginalia-tts", default-features = false }
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
